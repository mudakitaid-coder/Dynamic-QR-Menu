const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const hhmm = (t) => (t || '').slice(0, 5);
const jam = (t) => hhmm(t).replace(':', '.') + ' WIB';
const dateId = (d) => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '-';
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

// Batas konsumsi: jika jam maksimal <= jam produksi, dianggap hari berikutnya
const expiryAt = (m) => {
  if (!m.production_date || !m.max_consume_time) return null;
  const e = new Date(m.production_date + 'T' + hhmm(m.max_consume_time));
  if (hhmm(m.max_consume_time) <= hhmm(m.production_time)) e.setDate(e.getDate() + 1);
  return e;
};

  { id: 'demo-2', slug: 'ikan-dori-lemon', name: 'Paket Ikan Dori Saus Lemon', emoji: '🐟', items: ['Nasi putih', 'Ikan dori saus lemon', 'Kentang tumbuk', 'Buncis rebus'], description: 'Fillet ikan dori panggang dengan saus lemon-butter yang ringan.', production_date: today(), production_time: '06:00', max_consume_time: '12:00', calories: 460, protein: 30, carbs: 44, fat: 18 },
];
const norm = (m) => ({ ...m, items: m.items || [], production_time: hhmm(m.production_time) || '06:00', max_consume_time: hhmm(m.max_consume_time) || '12:00' });

/* ---------- Gambar (resize sebelum unggah), poster 1080x1080 & riwayat lokal ---------- */
const resizeImage = (file, max, mime) => new Promise((res, rej) => {
  if (!/^image\//.test(file.type)) return rej(new Error('File harus berupa gambar'));
  if (file.size > 15e6) return rej(new Error('Ukuran file maksimal 15 MB'));
  const r = new FileReader(); r.onerror = () => rej(new Error('Gagal membaca file'));
  r.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('Gambar tidak valid'));
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      const c = cv.getContext('2d'); if (mime === 'image/jpeg') { c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); } c.drawImage(im, 0, 0, cv.width, cv.height);
      cv.toBlob((b) => b ? res({ blob: b, url: cv.toDataURL(mime, 0.85) }) : rej(new Error('Gagal memproses gambar')), mime, 0.85); };
    im.src = r.result; };
  r.readAsDataURL(file);
});
const HK = ['name', 'emoji', 'items', 'description', 'production_date', 'production_time', 'max_consume_time', 'calories', 'protein', 'carbs', 'fat', 'photo_url', 'poster_title', 'portions', 'fiber'];
const FL = { name: 'Nama menu', emoji: 'Ikon', items: 'Isi paket', description: 'Deskripsi', production_date: 'Tanggal produksi', production_time: 'Jam produksi', max_consume_time: 'Jam maksimal konsumsi', calories: 'Kalori', protein: 'Protein', carbs: 'Karbohidrat', fat: 'Lemak', photo_url: 'Foto menu', poster_title: 'Judul poster', portions: 'Jumlah porsi', fiber: 'Serat' };
const fv = (k, v) => { if (v == null || v === '') return '(kosong)'; if (Array.isArray(v)) return v.join(', ') || '(kosong)'; if (k === 'production_date') return dateId(v); if (/_time$/.test(k)) return jam(v); const t = String(v); return t.length > 90 ? t.slice(0, 90) + '…' : t; };
const diffMenu = (a, b) => { const ch = {}; HK.forEach((k) => { const x = k === 'items' ? (a.items || []).join('|') : (a[k] == null ? '' : a[k]), y = k === 'items' ? (b.items || []).join('|') : (b[k] == null ? '' : b[k]);
  if (String(x) !== String(y)) ch[k] = k === 'photo_url' ? { from: !!a[k], to: !!b[k] } : { from: a[k] == null ? null : a[k], to: b[k] == null ? null : b[k] }; }); return ch; };
const logLocal = (action, m, changes) => { if (action === 'update' && !Object.keys(changes).length) return; const h = store.get('qm-history', []);
  h.push({ id: 'h-' + Date.now() + Math.random().toString(36).slice(2, 6), menu_id: m.id, menu_name: m.name, action, changes, changed_by_email: 'Mode demo', created_at: new Date().toISOString() }); store.set('qm-history', h.slice(-300)); };

/* ---------- Lapisan data (Supabase atau demo localStorage) ---------- */
const api = {
  async menus(tid) {
    if (!sb) return store.get('qm-menus', DEMO).map(norm);
    const { data, error } = await sb.from('menus').select('*').eq('tenant_id', tid).order('created_at'); if (error) throw error; return data.map(norm);
  },
  async menu(slug) {
    if (!sb) return store.get('qm-menus', DEMO).map(norm).find((m) => m.slug === slug) || null;
    const { data, error } = await sb.from('menus').select('*').eq('slug', slug).maybeSingle(); if (error) throw error; return data ? norm(data) : null;
  },
  async save(m) {
    const row = { id: m.id, tenant_id: m.tenant_id, slug: m.slug, name: m.name, emoji: m.emoji, items: m.items.map((s) => s.trim()).filter(Boolean), description: m.description,
      production_date: m.production_date, production_time: m.production_time, max_consume_time: m.max_consume_time,
      calories: +m.calories || 0, protein: +m.protein || 0, carbs: +m.carbs || 0, fat: +m.fat || 0, photo_url: m.photo_url || null, poster_title: m.poster_title || null, portions: m.portions === '' || m.portions == null ? null : +m.portions, fiber: m.fiber === '' || m.fiber == null ? null : +m.fiber, updated_at: new Date().toISOString() };
    if (!sb) { delete row.tenant_id; const all = store.get('qm-menus', DEMO); const i = all.findIndex((x) => x.id === row.id); logLocal(i < 0 ? 'create' : 'update', row, i < 0 ? { name: { to: row.name } } : diffMenu(all[i], row)); if (i < 0) all.push(row); else all[i] = row; store.set('qm-menus', all); return; }
    const { error } = await sb.from('menus').upsert(row); if (error) throw error;
  },
  async remove(id) {
    if (!sb) { const all = store.get('qm-menus', DEMO), old = all.find((x) => x.id === id); if (old) logLocal('delete', old, { name: { from: old.name } }); store.set('qm-menus', all.filter((x) => x.id !== id)); return; }
    const { error } = await sb.from('menus').delete().eq('id', id); if (error) throw error;
  },
  async akg(tid) {
    if (!sb) return store.get('qm-akg', DEFAULT_AKG);
    if (!tid) return DEFAULT_AKG;
    const { data, error } = await sb.from('app_settings').select('*').eq('tenant_id', tid).maybeSingle(); if (error) throw error; return data || DEFAULT_AKG;
  },
  async saveAkg(tid, a) {
    const row = { akg_calories: +a.akg_calories || 1, akg_protein: +a.akg_protein || 1, akg_carbs: +a.akg_carbs || 1, akg_fat: +a.akg_fat || 1 };
    if (!sb) { store.set('qm-akg', row); return; }
    const { error } = await sb.from('app_settings').upsert({ tenant_id: tid, ...row, updated_at: new Date().toISOString() }, { onConflict: 'tenant_id' }); if (error) throw error;
  },
  /* --- logo tenant, unggah gambar, riwayat --- */
  async brand(tid) {
    const blank = { name: '', logo_url: '' };
    if (!sb) return store.get('qm-brand', blank);
    if (!tid) return blank;
    const { data, error } = await sb.rpc('tenant_brand', { p_tenant: tid }); if (error) throw error; return (data && data[0]) || blank;
  },
  async setLogo(tid, url) {
    if (!sb) { store.set('qm-brand', { ...store.get('qm-brand', {}), logo_url: url }); return; }
    const { error } = await sb.rpc('set_tenant_logo', { p_tenant: tid, p_url: url || '' }); if (error) throw error;
  },
  async upload(tid, kind, file) {
    const logo = kind === 'logo', mime = logo ? 'image/png' : 'image/jpeg';
    const r = await resizeImage(file, sb ? (logo ? 512 : 1200) : (logo ? 256 : 640), mime);
    if (!sb) return r.url;
    const path = tid + '/' + kind + '-' + Date.now() + (logo ? '.png' : '.jpg');
    const { error } = await sb.storage.from('menu-media').upload(path, r.blob, { contentType: mime, upsert: true, cacheControl: '31536000' }); if (error) throw error;
    return sb.storage.from('menu-media').getPublicUrl(path).data.publicUrl;
  },
  async history({ menuId, tenantId }) {
    if (!sb) { let h = store.get('qm-history', []); if (menuId) h = h.filter((x) => x.menu_id === menuId); return h.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 100); }
    let q = sb.from('menu_history').select('*').order('created_at', { ascending: false }).limit(100);
    q = menuId ? q.eq('menu_id', menuId) : q.eq('tenant_id', tenantId);
    const { data, error } = await q; if (error) throw error; return data;
  },
  /* --- multitenant --- */
  async me(uid) {
    const { data, error } = await sb.from('profiles').select('*, tenants(name)').eq('user_id', uid).maybeSingle(); if (error) throw error; return data;
  },
  async tenants() { const { data, error } = await sb.from('tenants').select('*').order('created_at'); if (error) throw error; return data; },
  async owners() { const { data, error } = await sb.from('profiles').select('*').eq('role', 'owner').order('created_at'); if (error) throw error; return data; },
  async createTenant(name, slug) { const { data, error } = await sb.from('tenants').insert({ name, slug }).select().single(); if (error) throw error; return data; },
  async deleteTenant(id) { const { error } = await sb.from('tenants').delete().eq('id', id); if (error) throw error; },
  async createOwner(email, pw, tid) { const { error } = await sb.rpc('create_owner', { p_email: email, p_password: pw, p_tenant: tid }); if (error) throw error; },
  async setPw(uid, pw) { const { error } = await sb.rpc('set_owner_password', { p_uid: uid, p_password: pw }); if (error) throw error; },
  async delOwner(uid) { const { error } = await sb.rpc('delete_owner', { p_uid: uid }); if (error) throw error; },
};

/* ---------- Tampilan menu untuk pelanggan (dipakai halaman publik & preview) ---------- */
function MenuView({ menu, akg, brand, onDownload }) {
  const exp = expiryAt(menu);
  const expired = exp && Date.now() > exp.getTime();
  const items = (menu.items || []).filter(Boolean);
  const nf = (v) => String(Math.round((+v || 0) * 10) / 10).replace('.', ',');
  const rows = [['Karbohidrat', 'carbs', 'g', 'akg_carbs'], ['Serat', 'fiber', 'g', null], ['Protein', 'protein', 'g', 'akg_protein'], ['Lemak', 'fat', 'g', 'akg_fat'], ['Energi', 'calories', 'kkal', 'akg_calories']].filter((r) => r[1] !== 'fiber' || +menu.fiber > 0);
  const dshort = menu.production_date ? new Date(menu.production_date + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
  const title = (menu.poster_title || '').trim() || 'Menu hari ini';
  const bn = brand && brand.name;
  const panel = { background: '#123a9a' };
  return (
    <div className="relative overflow-hidden text-white min-h-full" style={{ background: 'linear-gradient(180deg,#2358d8,#1740b0)' }}>
      {menu.photo_url && <img src={menu.photo_url} alt="" aria-hidden="true" className="absolute top-0 left-0 w-full h-80 object-cover opacity-15 blur-sm" />}
      <div className="relative px-5 pt-7 pb-6 text-center">
        {brand && brand.logo_url ? <img src={brand.logo_url} alt="Logo" className="mx-auto w-16 h-16 rounded-full bg-white object-contain p-1.5" />
          : bn ? <div className="mx-auto w-16 h-16 rounded-full bg-white text-blue-800 flex items-center justify-center text-xl font-extrabold">{bn.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase()}</div> : null}
        {bn && <div className="mt-2.5 text-[11px] font-semibold uppercase tracking-[0.22em] text-white/90">{bn}</div>}
        <h2 className="mt-4 text-[2rem] leading-[1.05] font-extrabold uppercase">{title}</h2>
        <div className="mt-3"><span className="inline-block rounded-xl bg-amber-400 text-slate-900 font-bold text-sm px-4 py-2">{dshort}</span></div>
      </div>
      <div className="relative px-4 pb-8 space-y-4">
        <div className="relative">
          <div className="rounded-3xl overflow-hidden border-4 border-white/30 aspect-[4/3] flex items-center justify-center" style={panel}>{menu.photo_url ? <img src={menu.photo_url} alt={menu.name} className="w-full h-full object-cover" /> : <span className="text-7xl">{menu.emoji}</span>}</div>
          {+menu.portions > 0 && <div className="absolute -top-3 -left-1 -rotate-3 rounded-2xl bg-amber-400 text-slate-900 px-4 py-2 text-center shadow-lg"><div className="text-2xl font-extrabold leading-none">{(+menu.portions).toLocaleString('id-ID')}</div><div className="text-[11px] font-bold tracking-[0.3em]">PORSI</div></div>}
        </div>
        <div className="text-center"><div className="font-extrabold text-lg leading-tight">{menu.emoji} {menu.name}</div>{menu.description && <p className="mt-1.5 text-sm text-white/80 leading-relaxed">{menu.description}</p>}</div>

        <div className="rounded-2xl border-2 border-blue-400/60 overflow-hidden" style={panel}>
          <div className="px-4 py-3 font-extrabold text-amber-400 text-lg" style={{ background: '#0e2f85' }}>Nilai gizi per porsi</div>
          <dl className="px-4 py-3 space-y-2.5 text-sm">
            {rows.map(([l, k, u, ak]) => { const v = +menu[k] || 0, pct = ak ? Math.round((v / (+akg[ak] || 1)) * 100) : null; return (
              <div key={k}>
                <div className="flex items-baseline gap-2"><dt className="w-28 font-bold">{l}</dt><dd className="flex-1 font-semibold">: {nf(v)} {u}</dd>{pct !== null && <span className="text-xs font-bold text-amber-300">{pct}% AKG</span>}</div>
                {pct !== null && <div className="mt-1 h-1.5 rounded-full bg-blue-950/50"><div className="h-full rounded-full bg-amber-400" style={{ width: Math.min(100, pct) + '%' }} /></div>}
              </div>); })}
          </dl>

        </div>

        <div className="rounded-2xl border-2 border-blue-400/60 p-4 text-center" style={panel}>
          <div className="font-extrabold text-amber-400 text-lg">Isi paket</div>
          <p className="mt-2 font-bold text-sm leading-relaxed">{items.length ? items.join(' | ') : 'Belum ada daftar menu.'}</p>
        </div>

        <div className="rounded-2xl border-2 border-blue-400/60 p-4" style={panel}>
          <div className="font-extrabold text-amber-400 text-lg">Info produksi</div>

/* ---------- Kartu QR (satu QR untuk satu menu) ---------- */
function QRCard({ menu, url }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = '';
    try { new QRCode(ref.current, { text: url, width: 512, height: 512, colorDark: '#0f2a5c', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  }, [url]);
  const download = () => {
    const src = ref.current && ref.current.querySelector('canvas'); if (!src) return;
    const pad = 48, head = 80, foot = 50, out = document.createElement('canvas');
    out.width = src.width + pad * 2; out.height = src.height + pad * 2 + head + foot;
    const c = out.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, out.width, out.height);
    c.textAlign = 'center'; c.fillStyle = '#0f2a5c'; c.font = '700 38px sans-serif';
    c.fillText(menu.name.slice(0, 32), out.width / 2, pad + 40);
    c.drawImage(src, pad, pad + head);
    c.fillStyle = '#64748b'; c.font = '500 24px sans-serif';
    c.fillText('Scan untuk info menu & gizi', out.width / 2, out.height - pad + 8);
    const a = document.createElement('a'); a.download = 'qr-' + menu.slug + '.png'; a.href = out.toDataURL('image/png'); a.click();
  };
  return (
    <div className="bg-sky-50/60 rounded-2xl border border-sky-100 p-4 flex flex-col items-center text-center">
      <div className="font-bold text-slate-900 text-sm">{menu.emoji} {menu.name}</div>
      <a href={url} target="_blank" rel="noreferrer" className="mt-0.5 text-[11px] text-sky-600 break-all hover:underline">{url}</a>
      <div className="mt-3 w-40 p-2.5 rounded-2xl bg-white border border-sky-100"><div ref={ref} className="qr-box" aria-label={'QR ' + menu.name} /></div>
      <button onClick={download} className={btnPrimary + ' mt-3 w-full flex items-center justify-center gap-2'}><Icon d={I.down} className="w-4 h-4" />Cetak QR (.png)</button>
    </div>
  );
}

    const spaced = (t, x, y, gap) => { const a = [...t], w = a.reduce((s, ch) => s + c.measureText(ch).width + gap, -gap); let cx = x - w / 2; a.forEach((ch) => { c.fillText(ch, cx, y); cx += c.measureText(ch).width + gap; }); };
    const nf = (v) => String(Math.round((+v || 0) * 10) / 10).replace('.', ',');
    c.textAlign = 'left';

    if (ph) { c.save(); c.globalAlpha = 0.16; try { c.filter = 'blur(6px)'; } catch (e) {} cov(ph, -20, -20, W + 40, W + 40); c.restore(); }

    c.restore(); c.textAlign = 'left';
    if (brand && brand.name) { c.fillStyle = '#fff'; c.font = F(500, 24); spaced(fit(brand.name.toUpperCase(), 760), 540, 192, 6); }

    for (; fs >= 52; fs -= 4) { c.font = F(800, fs); lines = []; let cur = ''; title.split(/\s+/).forEach((w) => { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > 960 && cur) { lines.push(cur); cur = w; } else cur = t; }); lines.push(cur); if (lines.length <= 2) break; }

      c.fillStyle = INK; c.textAlign = 'center'; c.font = F(800, 58); c.fillText((+menu.portions).toLocaleString('id-ID'), 0, 14); c.font = F(600, 24); spaced('PORSI', 0, 50, 8); c.restore(); c.textAlign = 'left'; }

    // batas konsumsi
    const exp = expiryAt(menu), expired = exp && Date.now() > exp.getTime(); rr(250, 1004, 580, 50, 25); c.fillStyle = expired ? '#0f172a' : YEL; c.fill();
    c.fillStyle = expired ? '#fff' : INK; c.font = F(700, 25); c.fillText(expired ? 'Sudah melewati batas konsumsi' : 'Konsumsi sebelum ' + jam(menu.max_consume_time), 540, 1038);
    cv.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'menu-' + menu.slug + '-1080x1080.jpg'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/jpeg', 0.92);
  } catch (e) { window.alert('Gagal membuat gambar: ' + (e.message || e)); }
}

/* ---------- Login admin (hanya saat Supabase aktif) ---------- */
function Login() {
  const [email, setEmail] = useState(''); const [pw, setPw] = useState(''); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const submit = async () => {
    setBusy(true); setErr('');
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) setErr('Email atau kata sandi salah.');
    setBusy(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white rounded-3xl border border-sky-100 p-6 shadow-sm">
        <LogoMark className="w-12 h-12" />
        <h1 className="mt-4 text-xl font-extrabold text-blue-900">Masuk admin</h1>
        <p className="text-sm text-slate-500">Kelola menu dan QR katering Anda.</p>
        <div className="mt-5 space-y-3">
          <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
          <Field label="Kata sandi"><input type="password" className={inputCls} value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submit()} /></Field>
          {err && <p className="text-sm font-medium text-slate-900 bg-sky-100 rounded-xl px-3 py-2">{err}</p>}
          <button onClick={submit} disabled={busy || !email || !pw} className={btnPrimary + ' w-full'}>{busy ? 'Masuk...' : 'Masuk'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Superadmin: kelola tenant & owner ---------- */
function OwnerAdd({ busy, onAdd }) {
  const [email, setEmail] = useState(''); const [pw, setPw] = useState('');
  return (
    <div className="mt-3 grid gap-2 sm:grid-cols-[1fr_1fr_auto] items-end">
      <Field label="Email owner baru"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
      <Field label="Kata sandi (min. 8)"><input type="text" className={inputCls} value={pw} onChange={(e) => setPw(e.target.value)} /></Field>
      <button disabled={busy || !email || pw.length < 8} onClick={async () => { if (await onAdd(email, pw)) { setEmail(''); setPw(''); } }} className={btnPrimary}>Tambah owner</button>
    </div>
  );
}
function SuperAdminApp({ onLogout }) {
  const [tenants, setTenants] = useState(null); const [owners, setOwners] = useState([]);
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [open, setOpen] = useState(null);
  const [f, setF] = useState({ name: '', slug: '', email: '', pw: '' });
  const load = async () => { try { const [t, o] = await Promise.all([api.tenants(), api.owners()]); setTenants(t); setOwners(o); } catch (e) { setErr(e.message || 'Gagal memuat data'); setTenants([]); } };
  useEffect(() => { load(); }, []);
  const run = async (fn) => {
    setBusy(true); setErr('');
    try { await fn(); await load(); return true; } catch (e) { setErr(e.message || String(e)); await load(); return false; } finally { setBusy(false); }
  };
  if (open) return <AdminApp key={open.id} tenantId={open.id} tenantName={open.name} onBack={() => setOpen(null)} onLogout={onLogout} />;
  const slugF = f.slug || slugify(f.name);
  const create = () => run(async () => {
    const t = await api.createTenant(f.name.trim(), slugF);
    const { email, pw } = f; setF({ name: '', slug: '', email: '', pw: '' });
    if (email) { try { await api.createOwner(email, pw, t.id); } catch (e) { throw new Error('Tenant dibuat, tapi owner gagal: ' + e.message + '. Tambahkan owner dari kartu tenant.'); } }
  });
  return (
    <div className="min-h-screen">
      <header className="bg-slate-900 text-white sticky top-0 z-20">
        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3"><LogoMark className="w-9 h-9" /><div className="leading-tight"><div className="font-extrabold">Dynamic QR Menu</div><div className="text-[11px] text-sky-300">Superadmin</div></div></div>
          <button onClick={onLogout} className="text-xs font-semibold text-sky-200 hover:text-white px-2">Keluar</button>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        {err && <div className="rounded-2xl bg-slate-900 text-white text-sm font-medium px-4 py-3">{err}</div>}
        <Card>
          <h2 className="font-bold text-slate-900">Tenant baru</h2>
          <p className="text-xs text-slate-500">Satu tenant = satu klien katering dengan menu, QR, dan acuan AKG sendiri. Owner bisa diisi sekarang atau nanti.</p>
          <div className="mt-4 grid gap-3 sm:grid-cols-2">
            <Field label="Nama tenant"><input className={inputCls} value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} /></Field>
            <Field label="Kode tenant"><input className={inputCls} value={slugF} onChange={(e) => setF({ ...f, slug: slugify(e.target.value) })} /></Field>
            <Field label="Email owner (opsional)"><input type="email" className={inputCls} value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
            <Field label="Kata sandi owner (min. 8)"><input type="text" className={inputCls} value={f.pw} onChange={(e) => setF({ ...f, pw: e.target.value })} /></Field>
          </div>
          <div className="mt-4 flex justify-end"><button disabled={busy || !f.name.trim() || !slugF || (f.email && f.pw.length < 8)} onClick={create} className={btnPrimary}>{busy ? 'Memproses...' : 'Buat tenant'}</button></div>
        </Card>
        {tenants === null ? <p className="text-sm text-slate-500">Memuat data...</p> : tenants.map((t) => {
          const os = owners.filter((o) => o.tenant_id === t.id);
          return (
            <Card key={t.id}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div><h3 className="font-bold text-slate-900">{t.name}</h3><div className="text-xs text-slate-500">{t.slug} &middot; {os.length} owner</div></div>
                <div className="flex gap-2">
                  <button className={btnPrimary} onClick={() => setOpen(t)}>Kelola menu</button>
                  <button className={btnSoft} disabled={busy} onClick={() => { if (window.confirm('Hapus tenant "' + t.name + '" beserta SEMUA menu dan akun owner-nya? QR menunya tidak akan bisa dibuka lagi.')) run(async () => { for (const o of os) await api.delOwner(o.user_id); await api.deleteTenant(t.id); }); }}>Hapus</button>
                </div>
              </div>
              <ul className="mt-3 divide-y divide-sky-100 text-sm">
                {os.length ? os.map((o) => (
                  <li key={o.user_id} className="flex items-center justify-between gap-3 py-2">
                    <span className="font-medium text-slate-700 break-all">{o.email}</span>
                    <span className="flex gap-3 shrink-0">
                      <button className="text-xs font-semibold text-sky-700 hover:underline" onClick={() => { const p = window.prompt('Kata sandi baru untuk ' + o.email + ' (min. 8 karakter):'); if (p) run(() => api.setPw(o.user_id, p)); }}>Ganti sandi</button>
                      <button className="text-xs font-semibold text-slate-900 hover:underline" onClick={() => { if (window.confirm('Hapus akun owner ' + o.email + '?')) run(() => api.delOwner(o.user_id)); }}>Hapus</button>
                    </span>
                  </li>)) : <li className="py-2 text-slate-500">Belum ada owner.</li>}
              </ul>
              <OwnerAdd busy={busy} onAdd={(email, pw) => run(() => api.createOwner(email, pw, t.id))} />
            </Card>);
        })}
      </main>
    </div>
  );
}

/* ---------- Root: /?m=slug = halaman publik; selain itu login -> superadmin / owner ---------- */
function App() {
  const slug = new URLSearchParams(location.search).get('m');
  const [session, setSession] = useState(undefined);
  const [prof, setProf] = useState(undefined);
  useEffect(() => {
    if (slug || !sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: l } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => l.subscription.unsubscribe();
  }, []);
  const uid = session && session.user.id;
  useEffect(() => {
    if (!sb || slug) return;
    if (!uid) { setProf(session === undefined ? undefined : null); return; }
    api.me(uid).then((p) => setProf(p || false)).catch(() => setProf(false));
  }, [uid, session === undefined]);
  if (slug) return <PublicPage slug={slug} />;
  if (!sb) return <AdminApp onLogout={null} />;
  if (session === undefined) return null;
  if (!session) return <Login />;
  const out = () => { setProf(undefined); sb.auth.signOut(); };
  if (prof === undefined) return null;
  if (!prof) return <NoAccess onLogout={out} />;
  if (prof.role === 'superadmin') return <SuperAdminApp onLogout={out} />;
  return <AdminApp key={prof.tenant_id} tenantId={prof.tenant_id} tenantName={prof.tenants && prof.tenants.name} onLogout={out} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
